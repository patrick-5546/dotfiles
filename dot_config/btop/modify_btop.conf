#!/bin/sh
set -eu

awk '
BEGIN {
    theme = 0
    vim_keys = 0
}
/^[[:space:]]*color_theme[[:space:]]*=/ {
    print "color_theme = \"tokyonight_night\""
    theme = 1
    next
}
/^[[:space:]]*vim_keys[[:space:]]*=/ {
    print "vim_keys = true"
    vim_keys = 1
    next
}
{
    print
}
END {
    if (!theme) {
        if (NR > 0) {
            print ""
        }
        print "color_theme = \"tokyonight_night\""
    }
    if (!vim_keys) {
        print "vim_keys = true"
    }
}
'
