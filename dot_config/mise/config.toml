# Tools that mise (https://mise.jdx.dev) installs. chezmoi applies this file to
# ~/.config/mise/config.toml, and run_onchange_after_install-tools-unix.sh
# installs the tools whenever it changes.
#
# - mise installs the tools in ~/.local/share/mise/installs, and
#   `mise activate zsh` in .zshrc puts the versions listed here on PATH.
# - Add or change a tool with `mise use -g TOOL[@VERSION]`, which keeps these
#   comments, then save the change with `chezmoi re-add ~/.config/mise`.
#   Run a tool once without adding it with `mise exec TOOL@VERSION -- COMMAND`.
# - Update the tools with `mise upgrade` and mise itself with `mise self-update`.
#
# See https://mise.jdx.dev/configuration.html
[tools]
# On Linux, the glibc builds of atuin and yazi need glibc 2.39 (Ubuntu 24.04),
# so use their static musl builds. mise uses glibc builds for the other tools,
# which matters for lsd: its musl build shows uid/gid instead of user names.
atuin = { version = "latest", libc = "musl" }
bat = "latest"
copilot = "latest"
delta = "latest"
dust = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
lazygit = "latest"
lsd = "latest"
neovim = "latest"
node = "lts"
ripgrep = "latest"
starship = "latest"
tmux = "latest"
uv = "latest"
yazi = { version = "latest", libc = "musl" }
zoxide = "latest"
